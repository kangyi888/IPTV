name: 'Live Update'
on:
  schedule:
    - cron: '0 19 * * *'  # UTC19点 = 北京时间次日03:00
    - cron: '0 5 * * *'   # UTC5点 = 北京时间13:00
  workflow_dispatch:
jobs:
  run_job:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 核心写权限，必须保留
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1 
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.10'
          
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install opencc-python-reimplemented
      - name: Merge custom blacklist(仅容器内临时覆盖)
        run: |
          # 将官方blacklist.txt和自定义my_blacklist.txt合并，覆盖容器内的blacklist.txt
          cat assets/whitelist-blacklist/blacklist.txt assets/whitelist-blacklist/my_blacklist.txt > assets/whitelist-blacklist/blacklist.txt

      - name: Run Python script
        run: |
          rm -f live.txt live.m3u live_lite.txt live_lite.m3u others.txt livemini.txt livemini.m3u
          python main.py

      # ===== 新增：生成精简版 livemini，剔除凤凰分组 =====
      - name: 生成精简版 livemini.txt（剔除凤凰分组）
        run: |
          awk 'BEGIN{flag=1} /凤凰频道,#genre#/{flag=0;next} /,#genre#/{flag=1} flag{print}' live.txt > livemini.txt
      - name: 生成精简版 livemini.m3u（剔除凤凰分组）
        run: |
          awk 'BEGIN{flag=1} /group-title="凤凰频道"/{flag=0;next} /^#EXTM3U/{flag=1;print;next} flag{print}' live.m3u > livemini.m3u

      - name: 暂存文件
        run: |
          FILES=("live.txt" "live.m3u" "live_lite.txt" "live_lite.m3u" "others.txt" "livemini.txt" "livemini.m3u")
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "✅ add $f"
            else
              echo "⚠️ 文件不存在，跳过: $f"
            fi
          done
          
      - name: 拉取最新代码并提交推送
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --cached --name-only | grep -q .; then
            git fetch origin main
            git commit -m "Live Update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') (CST)"
            git push origin HEAD:$GITHUB_REF_NAME --force
            echo "✅ 拉取最新代码并强制推送完成"
          else
            echo "ℹ️ 无文件变更，跳过提交和推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
