name: 'Live Update'
on:
  schedule:
    - cron: '0 22 * * *'  # UTC22点 = 北京时间次日06:00
    - cron: '0 9 * * *'   # UTC9点 = 北京时间17:00
  workflow_dispatch:
jobs:
  run_job:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 核心写权限，必须保留
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1 
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.10'
          
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install opencc-python-reimplemented
          # ==========【新增开始】合并官方黑名单 + 自定义my_blacklist.txt ==========
      - name: Merge custom blacklist(仅容器内临时覆盖)
        run: |
          # 将官方blacklist.txt和自定义my_blacklist.txt合并，覆盖容器内的blacklist.txt
          cat assets/whitelist-blacklist/blacklist.txt assets/whitelist-blacklist/my_blacklist.txt > assets/whitelist-blacklist/blacklist.txt
      # ==========【新增结束】==========
      - name: Run Python script
        run: |
          rm -f live.txt live.m3u live_lite.txt live_lite.m3u others.txt
          python main.py
      # ========== 修改这里：替换原来的git add硬编码，删除continue-on-error ==========
      - name: 暂存文件
        run: |
          FILES=("live.txt" "live.m3u" "live_lite.txt" "live_lite.m3u" "others.txt")
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "✅ add $f"
            else
              echo "⚠️ 文件不存在，跳过: $f"
            fi
          done
          
      - name: 拉取最新代码并提交推送
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --cached --name-only | grep -q .; then
            git fetch origin main
            git commit -m "Live Update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') (CST)"
            git push origin HEAD:$GITHUB_REF_NAME --force
            echo "✅ 拉取最新代码并强制推送完成"
          else
            echo "ℹ️ 无文件变更，跳过提交和推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
